<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Locked In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: blunt, motivating, clean like a locker-room whiteboard
   IDEA: a scoreboard for your own life
   PICTURE: the Life Score ring on Home; every tab is a working tool
   COLOUR and TYPE: near-black ground, lime accent, blue + orange support; Space Grotesk + Inter
   LAYOUT: phone-first app shell, cards, fixed bottom tabs, bottom-sheet forms */
:root{color-scheme:dark;--bg:#0E0F12;--card:#181A1F;--line:#23252B;--track:#2A2D34;--ink:#F2F3F5;--mute:#9A9EA7;--soft:#B7BBC3;--lime:#C6F432;--blue:#6EA8FF;--orange:#FF9F45}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;overflow-x:clip}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:24px 18px 120px}
h1{font:700 28px/1.1 'Space Grotesk',sans-serif;margin:0;text-wrap:balance}
h2{font:700 18px/1.2 'Space Grotesk',sans-serif;margin:0}
.big{font:700 34px/1 'Space Grotesk',sans-serif;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;color:var(--ink);text-align:left;width:100%}
.hl{background:#1C2112;border-color:#3A4A12}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mute{color:var(--mute);font-size:13px}.soft{color:var(--soft);font-size:13px}
.lime{color:var(--lime)}.orange{color:var(--orange)}.nw{white-space:nowrap}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--lime);transition:width .5s ease}
.bar.sm{height:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
button{font:inherit;cursor:pointer}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--track);background:transparent;color:var(--ink);font-weight:600;padding:0 14px;font-size:14px}
.btn.pri{background:var(--lime);color:#0E0F12;border:none;font-weight:700}
.btn.danger{border-color:#5a2a2a;color:#FF8A8A}
.flex1{flex:1}
.link{background:none;border:none;color:var(--lime);font-weight:600;font-size:13px;min-height:44px;padding:0 4px}
.icon{width:40px;height:40px;border-radius:12px;border:1px solid var(--track);background:transparent;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon.sm{width:32px;height:32px;border-radius:9px;border:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.check{display:flex;align-items:center;gap:12px;min-height:48px;flex:1;background:none;border:none;color:var(--ink);font-size:15px;text-align:left;padding:0}
.box{width:24px;height:24px;border-radius:7px;border:2px solid #3A3D45;flex:none;display:flex;align-items:center;justify-content:center;color:transparent}
.check.on .box{background:var(--lime);border-color:var(--lime);color:#0E0F12}
.check.on .lbl{color:var(--mute);text-decoration:line-through}
.dots{display:flex;gap:4px;flex:none}.dots i{width:11px;height:11px;border-radius:3px;background:var(--track)}.dots i.on{background:var(--lime)}
.pill{font-size:11px;font-weight:700;color:#0E0F12;background:var(--lime);padding:4px 8px;border-radius:6px;white-space:nowrap}
.list>div{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line)}
.list>div:first-child{border-top:none}
.empty{color:var(--mute);font-size:14px}
.wdots{display:flex;gap:6px;flex-wrap:wrap}.wdots i{width:16px;height:24px;border-radius:5px;background:var(--track)}.wdots i.on{background:var(--blue)}
nav{position:fixed;left:0;right:0;bottom:0;background:#121317;border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav .in{display:flex;justify-content:space-around;width:100%;max-width:480px}
nav button{background:none;border:none;color:#8B8F98;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;min-width:60px;min-height:48px}
nav button[aria-current=page]{color:var(--lime)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.sheet form{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--soft)}
input,select{font:inherit;font-size:16px;color:var(--ink);background:#0E0F12;border:1px solid var(--track);border-radius:12px;min-height:46px;padding:0 14px;width:100%}
.ring{position:relative;width:124px;height:124px;flex:none}.ring circle.v{transition:stroke-dasharray .7s ease}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--lime);color:#0E0F12;border-bottom-right-radius:6px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{min-height:38px;border-radius:99px;border:1px solid var(--track);background:none;color:var(--ink);padding:0 12px;font-size:13px}
.ask{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:8px 14px;background:linear-gradient(transparent,var(--bg) 30%)}
.ask form{display:flex;gap:8px;width:100%;max-width:452px}
.ask input{border-radius:24px;background:var(--card)}
.ask button{width:46px;height:46px;border-radius:23px;border:none;background:var(--lime);color:#0E0F12;flex:none;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#0E0F12;padding:6px 8px 6px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:center;gap:6px;z-index:20;white-space:nowrap}
.toast.show{opacity:1;pointer-events:auto}
.toast button{background:none;border:none;color:#3d5a00;font-weight:700;min-height:36px;padding:0 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app" id="view"></main>
<nav aria-label="Main"><div class="in" id="nav"></div></nav>
<div class="sheet" id="sheet"><form id="sf" novalidate></form></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="snap" accept="image/*" capture="environment" hidden>
<script>
{
const KEY='lockedin.v1';
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))};
const daysBetween=(a,b)=>{const p=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const $m=n=>'$'+Math.round(n).toLocaleString();
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const pct=(a,b)=>b>0?clamp(a/b*100):0;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sum=(a,f)=>a.reduce((x,y)=>x+(f?f(y):y),0);
const sv=(p,s=24,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
 home:sv('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
 fitness:sv('<path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/>'),
 money:sv('<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/>'),
 habits:sv('<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'),
 coach:sv('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>'),
 check:sv('<path d="M5 12l5 5 9-10"/>',16,3),
 x:sv('<path d="M6 6l12 12M18 6L6 18"/>',16),
 gear:sv('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',20),
 send:sv('<path d="M12 19V5M5 12l7-7 7 7"/>',20,2.4)
};
const TABS=[['home','Home'],['fitness','Fitness'],['money','Money'],['habits','Habits'],['coach','Coach']];

const fresh=()=>({v:1,t:0,onboarded:false,since:dkey(),name:'',
 habits:['Up by 6:00 AM','Cold shower','Skincare AM + PM','Read 20 min'].map(n=>({id:uid(),name:n,days:{}})),
 quit:null,
 fit:{start:0,goal:0,weights:[],cal:2500,protein:150,waterGoal:8,meals:{},water:{},lifts:[],sleep:{goal:8,bed:'23:00',log:{}}},
 money:{limit:1000,cats:['Food','Gas','Subscriptions','Fun','Other'],exp:[],savings:[],debts:[],invest:{monthly:0,total:0,log:[]}},
 chat:[]});
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||S.v!==1)S=fresh();
function migrate(){if(!S.fit.sleep)S.fit.sleep={goal:8,bed:'23:00',log:{}};if(!S.money.invest)S.money.invest={monthly:0,total:0,log:[]}}
migrate();

let cloud=null,writing=false,again=false,tm=null,undoSnap=null;
async function push(){
 if(!cloud)return;
 if(writing){again=true;return}
 writing=true;
 try{await cloud.set({s:JSON.stringify(S)})}catch(e){if(e&&e.code==='invalid_argument')cloud=null}
 writing=false;
 if(again){again=false;push()}
}
function prune(){
 const cut=addDays(dkey(),-90),f=S.fit;
 for(const o of [f.meals,f.water,f.sleep.log])for(const k in o)if(k<cut)delete o[k];
 S.money.invest.log=S.money.invest.log.slice(-300);
 const hcut=addDays(dkey(),-180);
 for(const h of S.habits)for(const k in h.days)if(k<hcut)delete h.days[k];
 S.money.exp=S.money.exp.filter(e=>e.d>=addDays(dkey(),-400));
 f.weights=f.weights.slice(-200);S.chat=S.chat.slice(-30);
}
function save(){
 S.t=Date.now();prune();
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 clearTimeout(tm);tm=setTimeout(push,700);
 render();
}
function snapshot(){undoSnap=JSON.stringify(S)}

const today=()=>dkey();
const monthExp=()=>{const mk=today().slice(0,7);return S.money.exp.filter(e=>e.d.startsWith(mk))};
function monthInfo(){const n=new Date(),D=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),d=n.getDate();return{D,d,left:D-d+1}}
const curWeight=()=>{const w=S.fit.weights;return w.length?w[w.length-1].v:S.fit.start};
function weightPct(){const f=S.fit;if(!f.goal||!f.start)return null;if(f.goal===f.start)return 100;return clamp((curWeight()-f.start)/(f.goal-f.start)*100)}
function streak(h){let k=today();if(!h.days[k])k=addDays(k,-1);let n=0;while(h.days[k]){n++;k=addDays(k,-1)}return n}
const dayMeals=()=>S.fit.meals[today()]||[];
function sleepAvg(){const t=today(),v=[];for(let i=0;i<7;i++){const h=S.fit.sleep.log[addDays(t,-i)];if(h!=null)v.push(h)}return v.length?avg(v):null}
const investMonth=()=>{const mk=today().slice(0,7);return sum(S.money.invest.log.filter(x=>x.d.startsWith(mk)),x=>x.amt)};
const fmtHrs=h=>{const H=Math.floor(h),M=Math.round((h-H)*60);return H+'h'+(M?' '+M+'m':'')};
const fmtBed=b=>{const [h,m]=String(b||'23:00').split(':').map(Number);return((h%12)||12)+':'+pad(m||0)+(h<12?' AM':' PM')};
function scores(){
 const t=today(),span=Math.min(7,Math.max(1,daysBetween(S.since||t,t)+1));
 let done=0,tot=0;
 for(const h of S.habits)for(let i=0;i<span;i++){tot++;if(h.days[addDays(t,-i)])done++}
 const hab=tot?done/tot*100:0;
 const f=S.fit,m=dayMeals();
 const parts=[pct(sum(m,x=>x.cal),f.cal),pct(f.water[t]||0,f.waterGoal)];
 const wp=weightPct();if(wp!==null)parts.push(wp);
 if(f.lifts.length)parts.push(avg(f.lifts.map(l=>pct(l.cur,l.goal))));
 const sa=sleepAvg();if(sa!==null)parts.push(pct(sa,f.sleep.goal));
 const fit=avg(parts);
 const mi=monthInfo(),spent=sum(monthExp(),e=>e.amt),pace=S.money.limit*mi.d/mi.D;
 let mon=spent<=pace?100:clamp(100-(spent-pace)/S.money.limit*200);
 const extra=[...S.money.savings.map(s=>pct(s.saved,s.goal)),...S.money.debts.map(d=>pct(d.start-d.left,d.start))];
 if(S.money.invest.monthly>0)extra.push(pct(investMonth(),S.money.invest.monthly*mi.d/mi.D));
 if(extra.length)mon=mon*.7+avg(extra)*.3;
 return{hab,fit,mon,all:Math.round(avg([hab,fit,mon]))};
}
function insight(){
 const mi=monthInfo(),spent=sum(monthExp(),e=>e.amt),pace=S.money.limit*mi.d/mi.D;
 const cal=sum(dayMeals(),x=>x.cal),hr=new Date().getHours();
 if(spent>pace+20)return`You're ${$m(spent-pace)} over your spending pace this month. Want a plan to get back on track?`;
 if(hr>=15&&cal<S.fit.cal*.6)return`You're ${(S.fit.cal-cal).toLocaleString()} calories short today. Want a cheap high-protein way to close the gap?`;
 const weak=S.habits.filter(h=>!h.days[today()]);
 if(hr>=18&&weak.length)return`${weak.length} habit${weak.length>1?'s':''} left today. Ask me how to stay consistent when you don't feel like it.`;
 return`Ask me to build a workout, plan cheap meals that hit your macros, or map out a savings plan.`;
}
const bar=(p,c='var(--lime)',sm)=>`<div class="bar${sm?' sm':''}"><i style="width:${Math.round(p)}%;background:${c}"></i></div>`;
const scoreWord=n=>n>=80?'Locked in':n>=60?'Solid. Keep pushing.':n>=40?'Slipping a little':'Time to reset';

const V={};
V.home=()=>{
 const sc=scores(),t=today(),f=S.fit,water=f.water[t]||0;
 const slept=f.sleep.log[t];
 const doneN=S.habits.filter(h=>h.days[t]).length+(water>=f.waterGoal?1:0)+(slept!=null?1:0),totN=S.habits.length+2;
 const C=339.3,dash=(sc.all/100*C).toFixed(1);
 const date=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
 const sub=[['Fitness',sc.fit,'var(--lime)'],['Money',sc.mon,sc.mon<60?'var(--orange)':'var(--lime)'],['Habits',sc.hab,'var(--lime)']];
 return`<div class="stack">
 <div class="between"><div><div class="mute">${esc(date)}</div><h1>${S.name?'Stay locked in, '+esc(S.name):'Stay locked in'}</h1></div><button class="icon" data-a="settings" aria-label="Settings">${I.gear}</button></div>
 <div class="card">
  <div class="row" style="gap:18px">
   <div class="ring"><svg width="124" height="124" viewBox="0 0 124 124" role="img" aria-label="Life Score ${sc.all} out of 100"><circle cx="62" cy="62" r="54" fill="none" stroke="#2A2D34" stroke-width="11"/><circle class="v" cx="62" cy="62" r="54" fill="none" stroke="#C6F432" stroke-width="11" stroke-linecap="round" stroke-dasharray="${dash} ${C}" transform="rotate(-90 62 62)"/></svg><div><span class="big" style="font-size:40px">${sc.all}</span><span class="mute">/ 100</span></div></div>
   <div class="stack" style="gap:6px"><span class="mute" style="font-weight:600">Life Score</span><span style="font:700 22px/1.15 'Space Grotesk',sans-serif">${scoreWord(sc.all)}</span><span class="soft">Built from your fitness, money and habit goals.</span></div>
  </div>
  <div class="grid3">${sub.map(([n,v,c])=>`<div class="stack" style="gap:6px"><div class="between"><span class="mute">${n}</span><b>${Math.round(v)}</b></div>${bar(v,c,1)}</div>`).join('')}</div>
 </div>
 <div class="card">
  <div class="between"><h2>Today</h2><span class="mute">${doneN} of ${totN} done</span></div>
  <div class="list">
  ${S.habits.map(h=>`<div><button class="check${h.days[t]?' on':''}" data-a="habit" data-id="${h.id}" aria-pressed="${!!h.days[t]}"><span class="box">${I.check}</span><span class="lbl">${esc(h.name)}</span></button><span class="mute nw">${streak(h)}d</span></div>`).join('')}
  <div><button class="check${water>=f.waterGoal?' on':''}" data-a="water" data-n="1"><span class="box">${I.check}</span><span class="lbl">Water</span></button><span class="mute nw">${water} / ${f.waterGoal}</span><button class="icon sm" data-a="water" data-n="1" aria-label="Add a glass" style="color:var(--blue);font-size:20px">+</button></div>
  <div><button class="check${slept!=null?' on':''}" data-a="sleep"><span class="box">${I.check}</span><span class="lbl">Log last night's sleep</span></button><span class="mute nw">${slept!=null?fmtHrs(slept):'Goal '+f.sleep.goal+'h'}</span></div>
  </div>
  ${S.habits.length?'':'<div class="empty">No habits yet. Add some in the Habits tab.</div>'}
 </div>
 <button class="card hl" data-a="tab" data-t="coach"><span class="row lime" style="gap:8px;font-size:12px;font-weight:700;letter-spacing:.04em">${I.coach.replace('width="24" height="24"','width="16" height="16"')} COACH</span><span style="font-size:15px;line-height:1.45">${esc(insight())}</span><span class="lime" style="font-size:13px;font-weight:600">Ask Coach →</span></button>
 </div>`;
};
V.fitness=()=>{
 const f=S.fit,t=today(),m=dayMeals(),cal=sum(m,x=>x.cal),pro=sum(m,x=>x.protein||0),water=f.water[t]||0,wp=weightPct();
 const cw=curWeight(),dir=f.goal>f.start?'Bulk':f.goal<f.start?'Cut':'Maintain';
 const prev=f.weights.length>1?f.weights[f.weights.length-2].v:null,chg=prev!==null?(cw-prev):null;
 return`<div class="stack">
 <div class="between"><h1>Fitness</h1>${f.goal?`<span class="pill">${dir.toUpperCase()} MODE</span>`:''}</div>
 <div class="card">
  ${f.goal?`<div class="between"><span class="mute">Weight goal</span><span class="mute">${f.start} → ${f.goal} lb</span></div>
  <div class="row" style="align-items:baseline;gap:8px"><span class="big">${cw}</span><span class="mute">lb</span>${chg!==null?`<span class="lime" style="margin-left:auto;font-size:13px;font-weight:600">${chg>=0?'+':''}${chg.toFixed(1)} since last</span>`:''}</div>
  ${bar(wp)}<div class="row"><button class="btn pri flex1" data-a="weight">Log weight</button><button class="btn" data-a="goalWeight">Edit goal</button></div>`
  :`<h2>Set a weight goal</h2><span class="soft">Losing, gaining or maintaining. Log your weight and watch the bar move.</span><button class="btn pri" data-a="goalWeight">Set goal</button>`}
 </div>
 <div class="card">
  <div class="between"><span class="mute">Calories today</span><button class="link" data-a="settings">Target ${f.cal.toLocaleString()}</button></div>
  <div class="row" style="align-items:baseline;gap:6px"><span class="big" style="font-size:30px">${cal.toLocaleString()}</span><span class="mute">kcal · ${cal>=f.cal?'target hit':(f.cal-cal).toLocaleString()+' to go'}</span></div>
  ${bar(pct(cal,f.cal))}
  <div class="between"><span class="mute">Protein</span><span class="mute">${pro} / ${f.protein}g</span></div>${bar(pct(pro,f.protein),'var(--blue)',1)}
  <div class="list">${m.map((x,i)=>`<div><span class="flex1">${esc(x.name)}</span><span class="mute nw">${x.cal} kcal${x.protein?' · '+x.protein+'g':''}</span><button class="icon sm" data-a="delMeal" data-i="${i}" aria-label="Remove ${esc(x.name)}">${I.x}</button></div>`).join('')}</div>
  ${m.length?'':'<div class="empty">Nothing logged yet today. Snap a photo of your plate and AI estimates the calories.</div>'}

 settings:()=>sheet('Settings',[{k:'n',label:'Your name',value:S.name},{k:'c',label:'Daily calorie target',type:'number',value:S.fit.cal},{k:'p',label:'Daily protein target (g)',type:'number',value:S.fit.protein},{k:'w',label:'Water goal (glasses)',type:'number',value:S.fit.waterGoal},{k:'l',label:'Monthly spending limit ($)',type:'number',value:S.money.limit}],'Save',v=>{if(!num(v.c,500)||!num(v.p)||!num(v.w)||!num(v.l))return'Fill in every target.';S.name=v.n.slice(0,30);S.fit.cal=Math.round(v.c);S.fit.protein=Math.round(v.p);S.fit.waterGoal=Math.min(30,Math.round(v.w));S.money.limit=v.l;save()},{extra:'<button type="button" class="btn danger" data-a="reset">Reset all data</button>',noFocus:1}),
 reset:()=>sheet('Reset everything?',[],'Erase all data',()=>{snapshot();const n=fresh();n.onboarded=true;n.name=S.name;S=n;save();toast('Everything reset',1)},{danger:true,desc:'This clears every goal, log and streak.'})
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||!A[el.dataset.a])return;e.preventDefault();A[el.dataset.a](el)});
document.addEventListener('submit',e=>{if(e.target.id!=='askf')return;e.preventDefault();const i=document.getElementById('askin');const q=i.value;i.value='';ask(q)});

function context(){
 const t=today(),f=S.fit,m=dayMeals(),mi=monthInfo(),ex=monthExp(),sc=scores();
 const byCat={};for(const e of ex)byCat[e.cat]=(byCat[e.cat]||0)+e.amt;
 return JSON.stringify({date:t,name:S.name||null,lifeScore:sc.all,subScores:{fitness:Math.round(sc.fit),money:Math.round(sc.mon),habits:Math.round(sc.hab)},
  weight:f.goal?{current:curWeight(),start:f.start,goal:f.goal,unit:'lb'}:null,
  today:{calories:sum(m,x=>x.cal),calorieTarget:f.cal,protein:sum(m,x=>x.protein||0),proteinTarget:f.protein,foods:m.map(x=>x.name),water:f.water[t]||0,waterGoal:f.waterGoal},
  prGoals:f.lifts.map(l=>({name:l.name,current:l.cur,target:l.goal,unit:l.unit})),
  money:{monthlyLimit:S.money.limit,spentThisMonth:Math.round(sum(ex,e=>e.amt)),daysLeftInMonth:mi.left,byCategory:byCat,savings:S.money.savings.map(s=>({name:s.name,saved:s.saved,goal:s.goal})),debts:S.money.debts.map(d=>({name:d.name,owed:d.left,start:d.start}))},
  sleep:{goalHours:f.sleep.goal,bedtime:f.sleep.bed,lastNight:f.sleep.log[t]??null,avg7:sleepAvg()},
  investing:{monthlyGoal:S.money.invest.monthly,thisMonth:investMonth(),totalInvested:S.money.invest.total},
  habits:S.habits.map(h=>({name:h.name,doneToday:!!h.days[t],streak:streak(h)})),
  breakingHabit:S.quit?{name:S.quit.name,daysClean:daysBetween(S.quit.since,t)}:null});
}
async function ask(q){
 q=String(q||'').trim();if(!q||busy)return;
 if(tab!=='coach')go('coach');
 const hist=S.chat.slice(-10).map(m=>(m.r==='me'?'User: ':'Coach: ')+m.t).join('\n');
 S.chat.push({r:'me',t:q.slice(0,500)});const m={r:'ai',t:''};S.chat.push(m);busy=true;render();
 const prompt=`You are Coach inside "Locked In", an all-in-one goals app for young men covering fitness, money and habits. Be direct, specific and motivating, like a good older brother who lifts and budgets. Use the user's real numbers below. Keep replies under 150 words: short lines or a short list, plain text, no markdown headings or bold. For food ideas favor cheap, high-protein options and give rough calories and protein. Never suggest crash diets, very low calories, skipping meals to lose weight fast, or unsafe training. You're not a doctor or financial advisor: for injuries, health conditions or big money decisions, say to check with a professional. If data is missing, say what to log.\n\nUSER DATA:\n${context()}\n\n${hist?'CONVERSATION SO FAR:\n'+hist+'\n\n':''}User: ${q}\nCoach:`;
 try{
  const sample=window.claude&&typeof window.claude.use==='function'?await window.claude.use('sample'):null;
  if(!sample)m.t="Coach can't connect here. Open Locked In on claude.ai while signed in to chat.";
  else{
   const res=await sample(prompt,{cache:false,onText:({text})=>{m.t=text;const els=document.querySelectorAll('#chat .msg.ai');const el=els[els.length-1];if(el&&tab==='coach'){el.textContent=text;}}});
   m.t=(res&&res.text)||m.t||'No answer came back. Try again.';
  }
 }catch(e){
  const c=e&&e.code;
  m.t=(e&&e.text?e.text+'\n\n':'')+(c==='rate_limited'?'Coach is busy. Give it a minute and try again.':c==='not_granted'?'Coach needs your OK to run. Tap send again and allow it.':"Couldn't reach Coach. Try again.");
 }
 busy=false;save();
}

async function shrink(file){
 const url=URL.createObjectURL(file);
 try{
  const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});
  const k=Math.min(1,1024/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.82));
 }finally{URL.revokeObjectURL(url)}
}
function busySheet(msg){sf.innerHTML=`<h2>${esc(msg)}</h2><span class="soft">Looking at what's on the plate and estimating portions…</span><div class="bar"><i style="width:35%"></i></div>`;onSub=null;sheetEl.classList.add('open');sheetEl.dataset.lock='1'}
function scanFail(msg){sheet('Couldn’t scan that',[],'Type it in instead',()=>{setTimeout(()=>A.meal(),0)},{desc:msg})}
document.getElementById('snap').addEventListener('change',async e=>{
 const file=e.target.files&&e.target.files[0];if(!file)return;
 busySheet('Scanning your meal');
 try{
  const sample=window.claude&&typeof window.claude.use==='function'?await window.claude.use('sample'):null;
  const lim=sample&&sample.limits?await sample.limits():null;
  if(!sample||!lim||!lim.images){sheetEl.dataset.lock='';return scanFail('Photo scanning isn’t available in this view. Open Locked In on claude.ai while signed in.')}
  const blob=await shrink(file);
  const res=await sample('You are a nutrition estimator. Identify every food and drink in this photo, estimate realistic portion sizes, and estimate calories and protein. Reply with ONLY a JSON object, no other text: {"name": "short meal name", "items": [{"food": "string", "portion": "string", "cal": number, "protein": number}], "cal": total calories as a number, "protein": total grams of protein as a number, "confidence": "low" | "medium" | "high"}. If the photo has no food, reply {"name": null}.',{images:[blob],cache:false});
  const mt=String(res&&res.text||'').match(/\{[\s\S]*\}/);
  const r=mt?JSON.parse(mt[0]):null;
  sheetEl.dataset.lock='';
  if(!r||!r.name)return scanFail('I couldn’t spot any food in that photo. Try again with the plate centered and good light.');
  const items=Array.isArray(r.items)?r.items.slice(0,8):[];
  const desc=(items.length?items.map(x=>`${x.food}${x.portion?' ('+x.portion+')':''}: ~${Math.round(+x.cal||0)} kcal`).join(' · ')+'. ':'')+`Confidence: ${r.confidence||'medium'}. It's an estimate, so adjust if it looks off.`;
  sheet('Looks like '+String(r.name).slice(0,50),[{k:'n',label:'Meal',value:String(r.name).slice(0,60)},{k:'c',label:'Calories (estimated)',type:'number',value:Math.round(+r.cal||0)},{k:'p',label:'Protein in grams (estimated)',type:'number',value:Math.round(+r.protein||0)}],'Add to log',v=>{if(!v.n)return'Name the meal.';if(!num(v.c,-1))return'Enter calories.';const t=today();(S.fit.meals[t]=S.fit.meals[t]||[]).push({name:v.n.slice(0,60),cal:Math.round(v.c),protein:num(v.p,-1)?Math.round(v.p):0,scan:true});save();toast('Meal logged')},{desc,noFocus:1});
 }catch(err){
  sheetEl.dataset.lock='';
  const c=err&&err.code;
  scanFail(c==='rate_limited'?'Scanner is busy. Give it a minute and try again.':c==='not_granted'?'The scanner needs your OK to run. Try again and allow it.':'Something went wrong reading that photo. Try again.');
 }
});

function onboard(){
 sheet('Let’s lock in',[{k:'n',label:'First name',ph:'Your name'},{k:'w',label:'Current weight (lb)',type:'number'},{k:'g',label:'Goal weight (lb)',type:'number'},{k:'c',label:'Daily calorie target',type:'number',value:2500},{k:'l',label:'Monthly spending limit ($)',type:'number',value:1000}],'Start',v=>{
  if(!num(v.c,500)||!num(v.l))return'Add a calorie target and spending limit.';
  S.name=v.n.slice(0,30);S.fit.cal=Math.round(v.c);S.money.limit=v.l;S.since=today();
  if(num(v.w,50)){S.fit.start=v.w;S.fit.weights=[{d:today(),v:v.w}];if(num(v.g,50))S.fit.goal=v.g}
  S.onboarded=true;save();
 },{noClose:1,desc:'Set a few goals now. You can change everything later. Weight is optional.'});
}

render();
if(!S.onboarded)onboard();

(async()=>{
 try{
  if(!window.claude||typeof window.claude.use!=='function')return;
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const ref=db.doc('data/users/'+id+'/state');
  const snap=await ref.get();
  let remote=null;
  if(snap.exists){try{remote=JSON.parse(snap.data().s)}catch(e){}}
  if(remote&&remote.v===1&&(remote.t||0)>(S.t||0)){
   S=remote;migrate();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
   if(S.onboarded&&sheetEl.dataset.lock)closeSheet();
   render();
  }
  cloud=ref;
  if(!remote||(S.t||0)>(remote.t||0))push();
 }catch(e){}
})();
}
